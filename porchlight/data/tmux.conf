# The tmux server of porchlight's hidden sessions. It runs on a socket of its own
# (tmux -L <server>), apart from any tmux the user runs, and shows nothing of its own:
# the tab that attaches to a session looks like Claude Code alone.
set -g status off
set -g default-terminal "screen-256color"
set -as terminal-features ",*:RGB"
set-environment -g COLORTERM truecolor
set -s escape-time 0
set -g history-limit 50000
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# The wheel scrolls, and a selection made by dragging goes to the Mac's clipboard.
set -g mouse on
set -s set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# What Claude Code's documentation asks of tmux, for Shift+Enter and notifications.
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
